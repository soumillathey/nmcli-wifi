[project]
name = "wifi-nmcli"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "soumillathey", email = "soumil.lathey@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wifi-nmcli = "wifi_nmcli.cli:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]

[tool.ruff]
line-length = 120


